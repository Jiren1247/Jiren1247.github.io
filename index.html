.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:64px;max-width:1040px;margin:0 auto;padding:56px 24px 80px}

nav a{display:block;padding:3px 0;color:var(--mute);text-decoration:none}
nav a:hover{color:var(--acc)}
section{margin:0 0 52px}
h2{font:600 22px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 18px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:0 0 14px;max-width:68ch}
.meta{font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;color:var(--mute)}
.row{display:grid;grid-template-columns:110px 1fr;gap:16px;margin-bottom:12px}
.row .d{font-family:"Source Sans 3",system-ui,sans-serif;font-size:14.5px;color:var(--mute);padding-top:2px}
.pub{margin-bottom:18px}
.pub .t{font-weight:600}

.filters{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.filters button{font:600 14px "Source Sans 3",system-ui,sans-serif;background:none;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.theme{margin-top:22px;font:14px "Source Sans 3",system-ui,sans-serif;background:none;border:0;color:var(--mute);cursor:pointer;padding:0;text-decoration:underline}
@media(max-width:800px){.wrap{grid-template-columns:1fr;gap:28px;padding-top:32px}aside{position:static}nav ul{display:flex;flex-wrap:wrap;gap:4px 16px}nav a{padding:0}.row{grid-template-columns:1fr;gap:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
